name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: DynIsl version, macOS version and Mac model
      placeholder: "DynIsl 0.6.2 · macOS 27.0 · MacBook Air M3"
    validations:
      required: true
